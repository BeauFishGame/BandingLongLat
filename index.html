<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"> 
<html xmlns="https://www.w3.org/1999/xhtml"> 
<head> 
	<title>Leaflet Location Picker Demo</title> 
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" /> 

	<link rel="stylesheet" href="//unpkg.com/leaflet@1.1.0/dist/leaflet.css" />

	<link rel="stylesheet" href="leaflet-locationpicker.css" />
	<link rel="stylesheet" href="style.css" />
</head>

<body>

<h4>Simple Example: <em></em></h4>

<script src="//unpkg.com/leaflet@1.1.0/dist/leaflet.js"></script>
<script src="//code.jquery.com/jquery-2.1.0.min.js"></script>
</form>
<form id="combinedMapForm">
    Combined map with callback and always open: <br />
    <div style="height: 600px; width: 500px;">
        <input id="geoloc" type="text" value="" size="20" />
        <div id="mapContainer" style="border: 1px solid black; height: 500px; width: 500px;"></div>
        <br /><br />
        <i>My band was found at:</i><br />
        <em style="color:black" id="callbackResult"></em><br />
    </div>
</form>

<script src="leaflet-locationpicker.js"></script>

<script>
    $('#geoloc').leafletLocationPicker(
        {
            alwaysOpen: true,
            mapContainer: "#mapContainer",
            height: 500,
            width: 500,
            locationFormat: '{lat};{lng}',
            locationMarker: true,
            map: {
                center: [-37.909534, 175.506592],
                zoom: 7,
                scrollWheelZoom: true,
                tap: true
            },
            layer: "OSM3"
        },
        function(e) {
            // This is the working callback part
            $('#callbackResult').text(e.location);
        }
    );
</script>


</body>
</html>
